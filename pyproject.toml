[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spawnkit"
version = "0.1.0.dev0"
description = "Process hygiene, worker supervision and batched GPU inference for spawn-mode multiprocessing"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "mathematiger", email = "mcop.unipb@gmail.com" }]
keywords = [
    "multiprocessing",
    "reinforcement-learning",
    "pytorch",
    "spawn",
    "cuda",
    "inference-server",
    "worker",
    "supervision",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
# Deliberately thin. The hygiene / supervision / run-identity tiers are stdlib + numpy, so
# `pip install spawnkit` stays a two-second install; torch arrives only with the [torch] extra
# that the batched inference service needs.
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
torch = ["torch>=2.0"]
bench = ["torch>=2.0"]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.4",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/mathematiger/spawnkit"
Documentation = "https://mathematiger.github.io/spawnkit/"
Source = "https://github.com/mathematiger/spawnkit"
Issues = "https://github.com/mathematiger/spawnkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/spawnkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a CUDA device (deselected in CI with -m 'not gpu')",
    "slow: takes more than a couple of seconds",
]
timeout = 300
filterwarnings = ["error::DeprecationWarning:spawnkit.*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "TRY", "RUF", "D", "ANN", "PT"]
ignore = [
    "D203",    # incompatible with D211
    "D213",    # incompatible with D212
    "ANN401",  # Any is the honest annotation for a user payload
    "TRY003",  # long messages in raises read better than a wall of exception classes
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN", "S101"]
"benchmarks/*" = ["D", "ANN", "T201"]
"examples/*" = ["D", "ANN", "T201"]

[tool.mypy]
files = ["src", "tests", "benchmarks"]
ignore_missing_imports = true
warn_unused_configs = true
warn_unused_ignores = true
check_untyped_defs = true
warn_unreachable = true
disallow_untyped_defs = true

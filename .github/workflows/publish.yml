name: publish

# Publishes to PyPI with Trusted Publishing (OIDC). There is no API token and no repository secret:
# PyPI is configured to trust this repository and this workflow filename, and the short-lived
# credential is minted from the `id-token: write` permission below.

on:
  push:
    tags: ["v*"]

jobs:
  # A tag does not get to skip the checks. Both reusable workflows must be green first.
  ci:
    uses: ./.github/workflows/ci.yml

  hygiene:
    uses: ./.github/workflows/hygiene.yml

  publish:
    needs: [ci, hygiene]
    runs-on: ubuntu-latest
    permissions:
      # Required to mint the OIDC token Trusted Publishing exchanges for an upload credential.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check the built artifacts
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      # Report every interpreter, do not stop the matrix at the first red one.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        # No paths: the set to check lives in pyproject's `files`, so this cannot drift from what a
        # bare `mypy` checks locally. It had — `benchmarks` was checked by one and not the other.
        run: mypy

      - name: Pytest
        # The runner is CPU-only; the service tier's GPU tests carry the `gpu` marker. The invocation
        # and the failure reporting live in the script, so this job and the service tier below cannot
        # run different commands - and so does the pytest flag set, which a contributor gets by
        # running the same script.
        run: scripts/ci_pytest.sh "python ${{ matrix.python-version }}"
        shell: bash

  service:
    # The matrix above deliberately installs no torch, which is what keeps the torch-free promise
    # honest - but it also means the service tier, the most intricate code here, would go untested.
    # This job installs the CPU torch build and runs it. GPU-only tests carry the `gpu` marker and
    # are deselected: a hosted runner has no device.
    name: service tier (cpu torch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install with CPU torch
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev]"

      - name: Pytest
        run: scripts/ci_pytest.sh "service tier (cpu torch)"
        shell: bash

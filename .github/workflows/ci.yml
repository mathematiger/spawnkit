name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      # Report every interpreter, do not stop the matrix at the first red one.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy src tests scripts

      - name: Pytest
        # The runner is CPU-only; the service tier's GPU tests carry the `gpu` marker.
        # Output is mirrored into the job summary on failure so the reason is readable from the
        # checks API without downloading the log, which needs a token a contributor may not have.
        run: |
          set -o pipefail
          pytest -q -m "not gpu" -rf --timeout=300 2>&1 | tee pytest.log
        shell: bash

      - name: Report failures
        if: failure()
        run: |
          {
            echo "### pytest failed on python ${{ matrix.python-version }}"
            echo '```'
            tail -n 120 pytest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

  service:
    # The matrix above deliberately installs no torch, which is what keeps the torch-free promise
    # honest - but it also means the service tier, the most intricate code here, would go untested.
    # This job installs the CPU torch build and runs it. GPU-only tests carry the `gpu` marker and
    # are deselected: a hosted runner has no device.
    name: service tier (cpu torch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install with CPU torch
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev]"

      - name: Pytest
        run: pytest -q -m "not gpu"

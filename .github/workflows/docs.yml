name: docs

on:
  push:
    branches: [main]
  # The build half runs on pull requests too, so a docstring that breaks `--strict` is caught by the
  # review rather than by the first red deploy after merge. Only `main` deploys; see the job's `if`.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Creates the Pages site if the repository does not have one yet, using the `pages: write`
      # permission above. Without it every deploy failed with "Failed to create deployment
      # (status: 404) ... Ensure GitHub Pages has been enabled", because a repository has no Pages
      # site until something asks for one and nothing here ever did. Skipped on pull requests: a
      # fork's token is read-only, and enabling Pages is not a pull request's business.
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
        with:
          enablement: true

      # The docs extra only: mkdocstrings reads the package through griffe, which resolves modules
      # from the AST instead of importing them, so the build needs neither torch nor a CUDA runtime.
      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[docs]"

      - name: Build
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

name: docs

on:
  push:
    branches: [main]
  # The build half runs on pull requests too, so a docstring that breaks `--strict` is caught by the
  # review rather than by the first red deploy after merge. Only `main` deploys; see the job's `if`.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # This workflow cannot enable Pages for the repository, and must not pretend it can. A
      # repository has no Pages site until someone asks for one, and until then every deploy fails
      # with "Failed to create deployment (status: 404) ... Ensure GitHub Pages has been enabled".
      # `actions/configure-pages` with `enablement: true` was tried and refused: creating a site is
      # an administrative call, and the workflow's GITHUB_TOKEN gets "Resource not accessible by
      # integration". So it is a one-time manual setting — Settings → Pages → Source: GitHub
      # Actions — after which every run here deploys on its own.

      # The docs extra only: mkdocstrings reads the package through griffe, which resolves modules
      # from the AST instead of importing them, so the build needs neither torch nor a CUDA runtime.
      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[docs]"

      - name: Build
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
